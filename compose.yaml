services:
  postgres:
    image: postgres:18-alpine
    profiles: ['local-db']
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
      POSTGRES_USER: ${POSTGRES_USER:-blog}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./tools/docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    profiles: ['local-cache']
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
